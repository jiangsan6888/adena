<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue3 + Supabase 游戏管理</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" style="max-width:900px;margin:20px auto;padding:20px;">
    <h2>Vue3 + Supabase 游戏管理</h2>
    <div style="margin-bottom:16px;padding:16px;background:#f8fafc;border-radius:8px;">
      <h4>Supabase 配置</h4>
      <div style="display:grid;grid-template-columns:1fr;gap:10px;max-width:700px;">
        <input v-model="config.url" placeholder="Supabase URL" style="padding:10px;border:1px solid #e2e8f0;border-radius:4px;">
        <input v-model="config.key" type="password" placeholder="Anon Key" style="padding:10px;border:1px solid #e2e8f0;border-radius:4px;">
        <input v-model="config.bucket" placeholder="存储桶名称" style="padding:10px;border:1px solid #e2e8f0;border-radius:4px;">
        <button @click="saveConfig" class="form-submit" style="width:auto;padding:10px 20px;background:#6952EB;">保存并连接</button>
      </div>
    </div>
    <div style="margin-bottom:16px;padding:16px;background:#f8fafc;border-radius:8px;">
      <h4>添加游戏</h4>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:end;">
        <input v-model="newGame.name" placeholder="游戏名称" style="padding:10px;border:1px solid #e2e8f0;border-radius:4px;">
        <input type="file" @change="onFileChange" accept="image/*" style="padding:10px;border:1px solid #e2e8f0;border-radius:4px;">
        <button @click="addGame" class="form-submit" style="width:auto;padding:10px 20px;background:#6952EB;">保存游戏</button>
      </div>
      <div v-if="preview" style="margin-top:10px;">
        <img :src="preview" style="max-width:120px;max-height:120px;object-fit:contain;border-radius:4px;">
      </div>
    </div>
    <div style="padding:16px;background:#f8fafc;border-radius:8px;">
      <h4>游戏列表</h4>
      <table style="width:100%;border-collapse:collapse;margin-top:10px;">
        <thead>
          <tr style="background:#f8fafc;">
            <th style="padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;">ID</th>
            <th style="padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;">名称</th>
            <th style="padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;">图标</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="g in games" :key="g.id">
            <td style="padding:6px;border-bottom:1px solid #e2e8f0;">{{ g.id }}</td>
            <td style="padding:6px;border-bottom:1px solid #e2e8f0;">{{ g.name }}</td>
            <td style="padding:6px;border-bottom:1px solid #e2e8f0;"><img :src="g.image" style="width:50px;height:50px;object-fit:contain;"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <script src="https://unpkg.com/vue@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
  <script>
    const { createApp, reactive } = Vue;
    function dataURLToBlob(dataUrl) {
      const arr = dataUrl.split(',');
      const mime = arr[0].match(/:(.*?);/)[1];
      const bstr = atob(arr[1]);
      let n = bstr.length;
      const u8arr = new Uint8Array(n);
      while (n--) u8arr[n] = bstr.charCodeAt(n);
      return new Blob([u8arr], { type: mime });
    }
    createApp({
      setup() {
        const state = reactive({
          sb: null,
          config: {
            url: localStorage.getItem('supabase_url') || '',
            key: localStorage.getItem('supabase_anon_key') || '',
            bucket: localStorage.getItem('supabase_bucket') || 'game-icons'
          },
          games: [],
          newGame: { name: '' },
          preview: ''
        });
        function connect() {
          state.sb = null;
          if (state.config.url && state.config.key) {
            try { state.sb = window.supabase.createClient(state.config.url, state.config.key); } catch(e) { state.sb = null; }
          }
        }
        function saveConfig() {
          localStorage.setItem('supabase_url', state.config.url);
          localStorage.setItem('supabase_anon_key', state.config.key);
          localStorage.setItem('supabase_bucket', state.config.bucket);
          connect();
          loadGames();
        }
        async function loadGames() {
          if (!state.sb) return;
          const { data, error } = await state.sb.from('games').select('*').order('id', { ascending: true });
          if (!error) state.games = data || [];
        }
        function onFileChange(e) {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => { state.preview = ev.target.result; };
          reader.readAsDataURL(file);
        }
        async function addGame() {
          if (!state.newGame.name) return;
          let imageUrl = state.preview || '';
          if (state.sb && imageUrl && imageUrl.startsWith('data:image/')) {
            const blob = dataURLToBlob(imageUrl);
            const ext = blob.type.includes('png') ? 'png' : 'jpg';
            const fileName = `${Date.now()}_${Math.random().toString(36).slice(2)}_${state.newGame.name.replace(/\s+/g,'')}.${ext}`;
            const path = `games/${fileName}`;
            const { error } = await state.sb.storage.from(state.config.bucket).upload(path, blob, { contentType: blob.type, upsert: true });
            if (!error) {
              const { data } = state.sb.storage.from(state.config.bucket).getPublicUrl(path);
              imageUrl = data.publicUrl || imageUrl;
            }
          }
          if (state.sb) {
            const { error } = await state.sb.from('games').insert({ name: state.newGame.name, image: imageUrl });
            if (!error) {
              state.newGame.name = '';
              state.preview = '';
              loadGames();
            }
          }
        }
        connect();
        loadGames();
        return { config: state.config, games: state.games, newGame: state.newGame, preview: state.preview, saveConfig, addGame, onFileChange };
      }
    }).mount('#app');
  </script>
</body>
</html>
